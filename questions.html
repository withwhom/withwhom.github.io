---
layout: page
title: Open questions
permalink: /questions/
---
{% for q in site.data.open_questions %}
    <div class="entry">
      <div class="entry-row">
        <span class="q-title"><span class="q-mark">Q.</span>{{ q.question | markdownify | strip | remove: "<p>" | remove: "</p>" }}</span>
      </div>
{% if q.context %}
      <div class="entry-desc">{{ q.context | markdownify }}</div>
{% endif %}
    </div>
{% endfor %}

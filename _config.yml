# Site
title: "Seunghwan Ryu — a mathematical scrapbook"
description: "Study notes, mostly mathematics, written up after each session."
url: "https://withwhom.github.io"
baseurl: ""
lang: en
timezone: Asia/Seoul
author:
  name: Seunghwan Ryu

# Scraps are ordinary posts (_posts/YYYY-MM-DD-slug.md).
permalink: /scraps/:title/
future: true          # never hide a scrap because of a timezone edge

# Markdown. kramdown's MathJax engine turns $$…$$ into \(…\) inline and
# \[…\] display; the layout renders those with KaTeX auto-render. (GitHub
# Pages ignores math_engine: ~, so the engine is set explicitly.)
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  hard_wrap: false

# GitHub Pages whitelist only.
plugins:
  - jekyll-feed
feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

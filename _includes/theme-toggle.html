<button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">☾</button>
<script>
  (function() {
    var toggle = document.getElementById("theme-toggle");
    var root = document.documentElement;

    function syncToggle() {
      var dark = root.getAttribute("data-theme") === "dark";
      toggle.textContent = dark ? "☀" : "☾";
      toggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    }
    syncToggle();

    toggle.addEventListener("click", function() {
      var toDark = root.getAttribute("data-theme") !== "dark";
      root.setAttribute("data-theme", toDark ? "dark" : "light");
      syncToggle();
      try {
        localStorage.setItem("theme", toDark ? "dark" : "light");
      } catch (e) { /* storage unavailable — theme still switches, just not remembered */ }
    });
  })();
</script>
